<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<button id="myBtn">Click me</button>

<script>
document.getElementById("myBtn").addEventListener("click", myFunction);

function myFunction() {
  alert ("Hello World!");
}




window.addEventListener("resize", function(){
  document.getElementById("demo").innerHTML = Math.random();
});


</script>

</body>
</html>
