<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;  /* 水平居中 */
  align-items: center;      /* 垂直居中 */
  flex-direction: column;   /* 让 h1 和 p 垂直排 */
}

#txt {
  font-size: 24px;
}
</style>
</head>

<body>

<h1>Time</h1>
<p>This is a 30 second timer :-D</p>
<div id="txt"></div>


<script>

let x = document.getElementById("txt");
setTimeout(function(){ x.innerHTML="2 seconds" }, 2000);
setTimeout(function(){ x.innerHTML="4 seconds" }, 4000);
setTimeout(function(){ x.innerHTML="6 seconds" }, 6000);
setTimeout(function(){ x.innerHTML="8 seconds" }, 8000);
setTimeout(function(){ x.innerHTML="10 seconds" }, 10000);
setTimeout(function(){ x.innerHTML="12 seconds" }, 12000);
setTimeout(function(){ x.innerHTML="14 seconds" }, 14000);
setTimeout(function(){ x.innerHTML="16 seconds" }, 16000);
setTimeout(function(){ x.innerHTML="18 seconds" }, 18000);
setTimeout(function(){ x.innerHTML="20 seconds" }, 20000);
setTimeout(function(){ x.innerHTML="22 seconds" }, 22000);
setTimeout(function(){ x.innerHTML="24 seconds" }, 24000);
setTimeout(function(){ x.innerHTML="26 seconds" }, 26000);
setTimeout(function(){ x.innerHTML="28 seconds" }, 28000);
setTimeout(function(){ x.innerHTML="times up" }, 30000);
</script>

<script>
myInterval = setInterval(setColor, 500);
 
function setColor() {
  let x = document.body;
  x.style.backgroundColor = x.style.backgroundColor == "yellow" ? "pink" : "yellow";
}
 
function stopColor() {
  clearInterval(myInterval);
}
</script>



</body>
</html>
