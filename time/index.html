<!DOCTYPE html>
<html>
<body>

<h1>Time</h1>


<p>This is a 30 second timer:-D</p>

<input type="text" id="txt">



<script>

setTimeout(function(){ x.value="20 seconds" }, 20000);

setTimeout(function(){ x.value="24 seconds" }, 24000);

setTimeout(function(){ x.value="times up" }, 30000);
</script>

<script>
myInterval = setInterval(setColor, 500);
 
function setColor() {
  let x = document.body;
  x.style.backgroundColor = x.style.backgroundColor == "yellow" ? "pink" : "yellow";
}
 
function stopColor() {
  clearInterval(myInterval);
}
</script>



</body>
</html>
